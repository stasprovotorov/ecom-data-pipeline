version: 2

models:
  - name: stg_order_items
    description: "Staging model for order items"
    columns:
      - name: order_item_id
        description: "Unique identifier of the order item"
        tests:
          - not_null
          - unique

      - name: order_id
        description: "Identifier of the order"
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id

      - name: product_id
        description: "Identifier of the product"
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id

      - name: user_id
        description: "Identifier of the user"
        tests:
          - not_null
          - relationships:
              to: ref('stg_users')
              field: user_id

      - name: quantity
        description: "Quantity of items in the order item"
        tests:
          - not_null

      - name: item_price
        description: "Price per item"
        tests:
          - not_null

      - name: item_total
        description: "Total amount for the order item"
        tests:
          - not_null

      - name: source_file
        description: "Source file name from which the record was loaded"

      - name: loaded_at
        description: "Timestamp when the record was loaded"

  - name: stg_orders
    description: "Staging model for orders"
    columns:
      - name: order_id
        description: "Unique identifier of the order"
        tests:
          - not_null
          - unique

      - name: user_id
        description: "Identifier of the user"
        tests:
          - not_null
          - relationships:
              to: ref('stg_users')
              field: user_id

      - name: order_date
        description: "Date and time when the order was created"
        tests:
          - not_null

      - name: order_status
        description: "Status of the order"
        tests:
          - not_null

      - name: total_amount
        description: "Total amount of the order"
        tests:
          - not_null

      - name: source_file
        description: "Source file name from which the record was loaded"

      - name: loaded_at
        description: "Timestamp when the record was loaded"

  - name: stg_products
    description: "Staging model for products"
    columns:
      - name: product_id
        description: "Unique identifier of the product"
        tests:
          - not_null
          - unique

      - name: product_name
        description: "Name of the product"
        tests:
          - not_null

      - name: category
        description: "Category of the product"

      - name: brand
        description: "Brand of the product"

      - name: price
        description: "Current price of the product"
        tests:
          - not_null

      - name: rating
        description: "Rating of the product"

      - name: source_file
        description: "Source file name from which the record was loaded"

      - name: loaded_at
        description: "Timestamp when the record was loaded"

  - name: stg_users
    description: "Staging model for users"
    columns:
      - name: user_id
        description: "Unique identifier of the user"
        tests:
          - not_null
          - unique

      - name: name
        description: "Name of the user"
        tests:
          - not_null

      - name: email
        description: "Email address of the user"
        tests:
          - not_null

      - name: gender
        description: "Gender of the user"

      - name: city
        description: "City of the user"

      - name: signup_date
        description: "Date when the user signed up"
        tests:
          - not_null

      - name: source_file
        description: "Source file name from which the record was loaded"

      - name: loaded_at
        description: "Timestamp when the record was loaded"
